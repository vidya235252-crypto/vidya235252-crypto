name: Profile summary cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day at 00:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-24.04  
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # If the run fails with "Resource not accessible by integration",
          # or cards are missing, create a Personal Access Token, save it as a
          # repo secret named SUMMARY_GITHUB_TOKEN, and use it here instead:
          # GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5 # IST is UTC+5:30; whole hours only
