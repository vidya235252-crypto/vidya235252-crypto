<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
  <title id="t">Vidya Kumari</title>
  <desc id="d">Terminal-style banner reading: whoami, Vidya Kumari, Building software. Thinking like an attacker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b10"/>
      <stop offset="1" stop-color="#15112b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="clip">
      <rect width="800" height="300" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="300" fill="url(#bg)"/>
    <rect width="800" height="300" fill="url(#grid)"/>

    <!-- soft purple / blue glows -->
    <circle cx="690" cy="70" r="110" fill="#7c3aed" opacity="0.35" filter="url(#blur)"/>
    <circle cx="770" cy="270" r="120" fill="#2563eb" opacity="0.30" filter="url(#blur)"/>

    <!-- terminal title bar -->
    <rect width="800" height="44" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="30" cy="22" r="6" fill="#4b5068"/>
    <circle cx="52" cy="22" r="6" fill="#7c3aed"/>
    <circle cx="74" cy="22" r="6" fill="#3b82f6"/>
    <text x="400" y="27" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#6b7190">~/vidya-kumari</text>

    <!-- content -->
    <text x="48" y="112" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="22" fill="#8b90b0"><tspan fill="#8b5cf6">$</tspan> whoami</text>
    <rect x="166" y="94" width="11" height="22" fill="#8b5cf6">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="46" y="186" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="700" fill="url(#name)" letter-spacing="1">Vidya Kumari</text>

    <text x="48" y="238" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="21" fill="#c4c8e0">Building software. Thinking like an attacker.</text>

    <rect y="296" width="800" height="4" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="799" height="299" rx="16" fill="none" stroke="#2a2f45"/>
</svg>
